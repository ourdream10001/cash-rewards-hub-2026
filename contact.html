<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us & Help Center | UpLevelRewards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { --black: #090909; --gold: #d8b36a; --gold-light: #f3d995; --ivory: #f7f3ea; --line: rgba(255,255,255,.10); }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:"DM Sans",sans-serif; background:var(--black); color:var(--ivory); line-height:1.8; }
.container{ width:min(900px, 90%); margin:auto; padding:80px 0; }
.logo{ font-size:20px; font-weight:700; color:var(--gold-light); text-decoration:none; display:inline-block; margin-bottom:40px; }
h1{ font-family:"Playfair Display",serif; font-size:42px; color:var(--gold-light); margin-bottom:20px; }
h2{ font-size:20px; color:#fff; margin-top:30px; margin-bottom:10px; }
p{ color:#99958d; font-size:14px; margin-bottom:15px; }
.contact-box{ background:rgba(255,255,255,0.03); border:1px solid var(--line); padding:30px; border-radius:12px; margin-top:30px; }
.contact-box p { color: #fff; font-weight: 500; }
.back-link{ display:inline-block; margin-top:40px; color:var(--gold); text-decoration:none; font-size:13px; font-weight:600; }
</style>
</head>
<body>
<div class="container">
    <a href="index.html" class="logo">UpLevel<span>Rewards</span></a>
    <h1>Help Center & Contact Us</h1>
    <p>Need assistance with your eligibility journey or have questions regarding the requirements? We are here to help.</p>
    
    <div class="contact-box">
        <h2>Support Desk</h2>
        <p>Email: support@uplevelrewards.com</p>
        <p style="margin-top: 10px;">Response Time: Within 24-48 business hours.</p>
    </div>

    <a href="index.html" class="back-link">← Back to Home</a>
</div>
</body>
</html>
